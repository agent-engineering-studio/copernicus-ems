[project]
name = "copernicus-ems"
version = "0.4.0"
description = "Client for Copernicus EMS Rapid Mapping: activations, observation masks, observed flood extents"
readme = "README.md"
keywords = ["copernicus", "emergency management", "rapid mapping", "flood", "geojson", "disaster", "remote sensing"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Zileni", email = "giuseppe.zileni@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Geometry: observed dry area, areas in km², summaries.
geo = ["shapely>=2.0", "pyproj>=3.6"]
# Label rasters and mask-aware metrics for flood models.
ml = ["copernicus-ems[geo]", "numpy>=1.26", "rasterio>=1.4"]
# GeoParquet export.
parquet = ["copernicus-ems[geo]", "pyarrow>=17"]
# MCP server for LLM agents: copernicus-ems mcp.
mcp = ["copernicus-ems[geo]", "mcp>=2.3"]

[project.scripts]
copernicus-ems = "copernicus_ems.cli:main"

[project.urls]
Homepage = "https://github.com/agent-engineering-studio/copernicus-ems"
Issues = "https://github.com/agent-engineering-studio/copernicus-ems/issues"
Changelog = "https://github.com/agent-engineering-studio/copernicus-ems/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp>=1.20",
    "mypy>=1.13",
    "numpy>=1.26",
    "pyarrow>=17",
    "pyproj>=3.6",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "rasterio>=1.4",
    "ruff>=0.8",
    "shapely>=2.0",
    "types-shapely>=2.1.0.20261030",
]
docs = [
    "mkdocstrings[python]>=1.0.8",
    "zensical>=0.0.74",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B018"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# No type information shipped.
module = ["rasterio", "rasterio.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "live: contract tests against the live services (COPERNICUS_EMS_LIVE=1, weekly in CI)",
]

[tool.coverage.run]
source = ["copernicus_ems"]
omit = ["*/copernicus_ems/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
