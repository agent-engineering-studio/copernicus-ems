<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" aria-label="copernicus-ems: where the water actually was, from Copernicus EMS Rapid Mapping, in Python">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .chip{fill:#f0efec} .aoi{fill:none;stroke:#52514e}
  @media (prefers-color-scheme: dark){ .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .chip{fill:#2a2a28} .aoi{stroke:#c3c2b7} }
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="1000" height="230" rx="14"/>
<text class="t1" x="40" y="88" font-size="44" font-weight="700">copernicus-ems</text>
<text class="t2" x="40" y="124" font-size="18">Where the water actually was, after a flood,</text>
<text class="t2" x="40" y="148" font-size="18">as GeoJSON, in a few lines of Python.</text>
<g font-size="13">
  <rect class="chip" x="40" y="172" width="128" height="28" rx="14"/><text class="t2" x="104" y="191" text-anchor="middle">Rapid Mapping</text>
  <rect class="chip" x="176" y="172" width="82" height="28" rx="14"/><text class="t2" x="217" y="191" text-anchor="middle">GeoJSON</text>
  <rect class="chip" x="266" y="172" width="66" height="28" rx="14"/><text class="t2" x="299" y="191" text-anchor="middle">async</text>
  <rect class="chip" x="340" y="172" width="104" height="28" rx="14"/><text class="t2" x="392" y="191" text-anchor="middle">no API key</text>
</g>
<!-- an area of interest (dashed) and the flooded polygons inside it, along a river -->
