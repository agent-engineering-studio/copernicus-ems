site_name: copernicus-ems
site_description: Copernicus EMS Rapid Mapping in Python — observed flood extents and observation masks as GeoJSON.
site_url: https://agent-engineering-studio.github.io/copernicus-ems/
repo_url: https://github.com/agent-engineering-studio/copernicus-ems
repo_name: agent-engineering-studio/copernicus-ems
edit_uri: edit/main/docs/
copyright: Code Apache-2.0 · Data © European Union, Copernicus Emergency Management Service

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: concepts.md
  - Recipes: recipes.md
  - API reference: api.md
  - Roadmap & AI: roadmap.md
  - Changelog: changelog.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            docstring_style: sphinx

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agent-engineering-studio/copernicus-ems
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/copernicus-ems/
