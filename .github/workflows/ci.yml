name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv build

  # The images of the demo build, and the page and its API answer.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: The command line and the demo start
        run: |
          # the bind mount, made by us before Docker makes it as root; the image runs as another user
          mkdir -p data/copernicus-ems && chmod 777 data/copernicus-ems
          docker compose run --rm cli --help
          docker compose up -d
          for i in $(seq 30); do
            curl -fs http://localhost:3000/api/health && curl -fs -o /dev/null http://localhost:3000/ && curl -fs -o /dev/null http://localhost:3000/tecnica && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

  # The page of the demo type-checks.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  # The card for the Developers Italia catalogue, checked by its official parser.
  publiccode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: italia/publiccode-parser-action@v1
        with:
          publiccode: publiccode.yml
          no-network: true
