# Pushing a tag vX.Y.Z publishes that version to PyPI through trusted
# publishing: no token lives in the repository secrets. It needs, once per
# package, a (pending) publisher on pypi.org pointing at this repository,
# this workflow file and the `pypi` environment.
#
# The GitHub release takes its notes from the version's section of
# CHANGELOG.md: a tag whose version has no section there publishes nothing.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the previous tag, for the compare link
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Tag matches the package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          version=$(uv version --short)
          awk -v head="## [$version]" 'index($0, head) == 1 {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo
            echo "---"
            echo
            echo "PyPI: https://pypi.org/project/${{ github.event.repository.name }}/$version/"
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } >> release-notes.md
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
