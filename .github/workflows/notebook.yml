# Runs a notebook of notebooks/ on real data, on demand.
# It spends Copernicus Data Space processing units (the CDSE_CLIENT_ID /
# CDSE_CLIENT_SECRET secrets) only for images not in the cached data
# directory: about 94 PU the first time for notebooks 01 and 02, then
# none; notebooks 03 and 04 only read what 02 fetched. The executed
# notebook and its figure are uploaded as an artifact, and so is the data
# directory (`ems-data`: Sentinel-1 images, labels, pair manifests, EMS
# layers), so other projects can reuse the images without spending PU:
#
#   gh run download <run id> -R agent-engineering-studio/copernicus-ems \
#     -n ems-data -D "$COPERNICUS_EMS_DATA_DIR"
name: notebook

on:
  workflow_dispatch:
    inputs:
      notebook:
        description: "Which notebook"
        type: choice
        default: 01_flood_segmentation_s1
        options:
          - 01_flood_segmentation_s1
          - 02_change_detection_s1
          - 03_cross_validation_s1
          - 04_false_alarms_s1
      budget_pu:
        description: "Processing units the run may spend at most"
        default: "100"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COPERNICUS_EMS_DATA_DIR: ${{ github.workspace }}/.ems-data
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Data directory (Sentinel-1 images already paid for)
        uses: actions/cache@v4
        with:
          path: .ems-data
          key: ems-data-${{ github.run_id }}
          restore-keys: ems-data-
      - run: uv sync --locked --extra cdse --group notebooks
      - name: Execute the notebook
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          NOTEBOOK_BUDGET_PU: ${{ inputs.budget_pu }}
          NOTEBOOK: ${{ inputs.notebook }}
          NOTEBOOK_FIGURE: ${{ github.workspace }}/out/figure.png
        run: |
          mkdir -p out
          cp "notebooks/$NOTEBOOK.ipynb" out/
          uv run --no-sync jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=3600 "out/$NOTEBOOK.ipynb"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: notebook-${{ inputs.notebook }}
          path: out/
      - name: Data directory as an artifact (reuse it elsewhere at 0 PU)
        uses: actions/upload-artifact@v7
        with:
          name: ems-data
          include-hidden-files: true
          retention-days: 90
          path: |
            .ems-data/*/sentinel-1/
            .ems-data/*/*.geojson
