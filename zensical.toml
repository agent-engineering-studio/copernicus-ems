# Documentation site, built by Zensical (https://zensical.org) from docs/
# and the docstrings in src/. Deployed to GitHub Pages by
# .github/workflows/pages.yml.

[project]
site_name = "copernicus-ems"
site_description = "Copernicus EMS Rapid Mapping in Python: observed flood extents and observation masks as GeoJSON."
site_url = "https://agentengineering.it/copernicus-ems/"
repo_url = "https://github.com/agent-engineering-studio/copernicus-ems"
repo_name = "agent-engineering-studio/copernicus-ems"
edit_uri = "edit/main/docs/"
copyright = "Code Apache-2.0 · Data © European Union, Copernicus Emergency Management Service"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "How it works" = "concepts.md" },
  { "Recipes" = "recipes.md" },
  { "Geometry & ML" = "ml.md" },
  { "Open imagery" = "scenes.md" },
  { "Sentinel-1 backscatter" = "backscatter.md" },
  { "MCP server" = "mcp.md" },
  { "Notebooks" = "notebooks.md" },
  { "API reference" = "api.md" },
  { "Roadmap & AI" = "roadmap.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/agent-engineering-studio/copernicus-ems"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/copernicus-ems/"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_root_heading = true
show_signature_annotations = true
separate_signature = true
members_order = "source"
docstring_style = "sphinx"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.check_paths = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
